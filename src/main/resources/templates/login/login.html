<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Login</title>
    <link rel="stylesheet" href="/assets/css/home.css">
</head>

<!-- Include o fragmento de configuração -->
<body class="light:bg-light-background">
<!-- Configuração do tema -->
<div th:replace="~{fragments/config :: config_default}"></div>


<div th:replace="fragments/config :: config_login"></div>
<div  class="auth-container mx-auto p-2 " style="padding: 10px;">
    <h1>Entrar</h1>
    <form th:action="@{login}" method="post" id="login-form">
        <label for="email">E-mail</label>
        <input type="text" name="username" id="email" placeholder="Seu e-mail" required />

        <label for="password">Senha</label>
        <input type="password" name="password" id="password" placeholder="Sua senha" required />

        <button type="submit">Entrar</button>
    </form>

    <p class="link-text">
        <a href="#" id="esqueci-senha-link">Esqueci minha senha</a>
    </p>

    <div id="recuperar-container" style="display:none;">
        <h2 style="text-align:center;">Recuperar senha</h2>
        <form id="recuperar-form">
            <label for="rec-email">Digite seu e-mail</label>
            <input type="email" id="rec-email" placeholder="Seu e-mail" required />
            <button type="submit">Enviar código</button>
        </form>
        <p class="link-text"><a href="#" id="voltar-login">Voltar ao login</a></p>
    </div>

    <p class="link-text">Não tem uma conta? <a th:href="@{/login/registrar}">Criar conta</a></p>
</div>

</body>
</html>
