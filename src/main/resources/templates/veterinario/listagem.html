<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Lista de Veterinarios</title>
</head>

<!-- Include o fragmento de configuração -->
<body class="light:bg-light-background">
<!-- Configuração do tema -->
<div th:replace="~{fragments/config :: config_default}"></div>
<!-- Navbar -->
<div th:replace="~{fragments/navbar :: navbar}"></div>
<!-- Items fixos do tema -->
<div th:replace="~{fragments/botaosubir :: botaosubir}"></div>
<div th:replace="~{fragments/config :: listas}"></div>
<!--<div th:replace="~{fragments/botaoAdicionar :: botaoAdicionar}"></div>-->
<!--espaçamento entre a navbar e o conteúdo principal-->
<div class="max-w-7xl mx-auto p-4 md:p-8 pt-24"></div>


<div class="container mt-5">

    <div class="alert alert-success alert-dismissible fade show" th:if="${mensagem}">
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        <span th:text="${mensagem}"></span>
    </div>

    <h2 class="mb-4">Veterinarios Cadastrados</h2>
    <a class="btn btn-primary mb-3" th:href="@{/veterinario/novo}">Novo veterinario</a>
    <table class="table table-bordered table-striped">
        <thead class="table-dark">
        <tr>            <th>ID</th>
            <th>Nome</th>
            <th>Email</th>
            <th>CPF</th>
            <th>Telefone</th>
            <th>CRMV</th>
            <th>Ações</th>


        </tr>
        </thead>
        <tbody id="tabela-usuarios">
        <!-- Recurso do Themyleaf. Verifica se a lista de veterinarios está vazia -->
        <tr th:if="${#lists.isEmpty(veterinarios)}">
            <td colspan="2">Nenhum registro encontrado</td>
        </tr>

        <!-- Recurso do Themyleaf. Percorre a lista de veterinarios e preenche a tabela -->
        <tr th:each="veterinario : ${veterinarios}">
            <td><span th:text="${veterinario.id}"> ID </span></td>
            <td><span th:text="${veterinario.nome}"> Nome </span></td>
            <td><span th:text="${veterinario.email}"> Email </span></td>
            <td><span th:text="${veterinario.cpf}"> CPF </span></td>
            <td><span th:text="${veterinario.telefone}"> CRMV </span></td>
            <td><span th:text="'CRMV-' + ${veterinario.crmv}"> Telefone </span></td>

            
            <td>
                <!-- Recurso do Themyleaf. Carrega o id do veterinario para ser alterado -->
                <a th:href="@{/veterinario/alterar/{id}(id=${veterinario.id})}" class="edit" data-toggle="modal">
                    <i class="material-icons" data-toggle="tooltip" title="Alterar">&#xE254;</i>
                </a>
                <a th:href="@{/veterinario/excluir/{id}(id=${veterinario.id})}"
                   th:data-confirm-delete="|Você gostaria de apagar ${veterinario.nome}?|"
                   onclick="if (!confirm(this.getAttribute('data-confirm-delete'))) return false"
                   class="delete">
                    <i class="material-icons" data-toggle="tooltip" title="Excluir">&#xE872;</i>
                </a>

            </td>
        </tr>
        </tbody>
    </table>
</div>
<br>
</body>
</html>
