<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Cadastro de users</title>
    <style>
        .mensagem {
            color: red;
        }
    </style>
</head>
<body class="light:bg-light-background">
<div th:fragment="user">

<!-- Configuração do tema -->
<div th:replace="~{fragments/config :: config_default}"></div>
<!-- Navbar -->
<div th:replace="~{fragments/navbar :: navbar}"></div>
<!-- Items fixos do tema -->
<div th:replace="~{fragments/botaosubir :: botaosubir}"></div>

    <div th:replace="~{fragments/config :: inserir_}"></div>

<!-- Espaçamento entre a navbar e o conteúdo principal -->
<div class="max-w-7xl mx-auto p-4 md:p-8 pt-24"></div>

<div class="container">
    <div class="row">
        <div class="col">

            <!-- Mensagem carregada após a inserção dos dados-->
            <div class="alert alert-success alert-dismissible fade show" th:if="${mensagem}">
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                <span th:text="${mensagem}"></span>
            </div>

            <div class="table-wrapper">
                <div class="table-title">
                    <div class="row">
                        <div class="col-sm-6">
                            <h2>Cadastro de <b>users</b></h2>
                        </div>
                        <div class="col-sm-6 text-end">
                            <a th:href="@{/user}" class="btn btn-primary"> Listagem <i class="fas fa-list"></i></a>
                        </div>
                    </div>
                </div>

                <!-- Formulário de cadastro -->
                <form th:action="@{/user/salvar}" th:object="${user}" method="post">

                    <div class="card">
                        <div class="card-header">
                            Dados do user
                        </div>

                        <div class="card-body">

                            <!-- Nome -->
                            <div class="form-control form-control-sm">
                                <label class="col-sm-12 col-form-label">E-mail:</label>
                                <div class="col-sm-12">
                                    <input class="form-control" type="text" th:field="*{email}">
                                </div>
                                <div class="col-sm-12">
                                    <span class="mensagem" th:if="${#fields.hasErrors('email')}"
                                          th:errors="*{email}"></span>
                                </div>
                            </div>

                            <!-- Espécie -->
                            <div class="form-control form-control-sm">
                                <label class="col-sm-12 col-form-label">Senha:</label>
                                <div class="col-sm-12">
                                    <input class="form-control" type="text" th:field="*{senha}">
                                </div>
                                <div class="col-sm-12">
                                    <span class="mensagem" th:if="${#fields.hasErrors('senha')}"
                                          th:errors="*{senha}"></span>
                                </div>
                            </div>

                        </div>
                    </div>

                    <br>

                    <div class="row">
                        <div class="col-sm-6">
                            <button class="btn btn-success" type="submit"> Salvar <i class="fas fa-save"></i></button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <!-- Rodapé -->
        <div th:replace="fragments/footer :: footer"></div>
    </div>
</div>
</div>
</body>
</html>
