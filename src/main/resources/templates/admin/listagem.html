<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Lista de admins</title>
</head>

<!-- Include o fragmento de configuração -->
<body class="light:bg-light-background">
<!-- Configuração do tema -->
<div th:replace="~{fragments/config :: config_default}"></div>
<!-- Navbar -->
<div th:replace="~{fragments/navbar :: navbar}"></div>
<!-- Items fixos do tema -->
<div th:replace="~{fragments/botaosubir :: botaosubir}"></div>
<div th:replace="~{fragments/config :: listas}"></div>
<!--<div th:replace="~{fragments/botaoAdicionar :: botaoAdicionar}"></div>-->
<!--espaçamento entre a navbar e o conteúdo principal-->
<div class="max-w-7xl mx-auto p-4 md:p-8 pt-24"></div>

<div class="container mt-5">

    <h2 class="mb-4">Admins Cadastrados</h2>
    <a class="btn btn-primary mb-3" th:href="@{/admin/novo}">Novo admin</a>
    <table class="table table-bordered table-striped">
        <thead class="table-dark">
        <tr>            <th>ID</th>
            <th>Nome</th>
            <th>Email</th>
            <th>CPF</th>
            <th>Telefone</th>
            <th>Ações</th>


        </tr>
        </thead>
        <tbody id="tabela-usuarios">
        <!-- Recurso do Themyleaf. Verifica se a lista de admins está vazia -->
        <tr th:if="${#lists.isEmpty(admins)}">
            <td colspan="2">Nenhum registro encontrado</td>
        </tr>

        <!-- Recurso do Themyleaf. Percorre a lista de admins e preenche a tabela -->
        <tr th:each="admin : ${admins}">
            <td><span th:text="${admin.id}"> ID </span></td>
            <td><span th:text="${admin.nome}"> Nome </span></td>
            <td><span th:text="${admin.email}"> Email </span></td>
            <td><span th:text="${admin.cpf}"> CPF </span></td>
            <td><span th:text="${admin.telefone}"> Telefone </span></td>


            <td>
                <!-- Recurso do Themyleaf. Carrega o id do admin para ser alterado -->
                <a th:href="@{/admin/alterar/{id}(id=${admin.id})}" class="edit" data-toggle="modal">
                    <i class="material-icons" data-toggle="tooltip" title="Alterar">&#xE254;</i>
                </a>
                <a th:href="@{/admin/excluir/{id}(id=${admin.id})}"
                   th:data-confirm-delete="|Você gostaria de apagar ${admin.nome}?|"
                   onclick="if (!confirm(this.getAttribute('data-confirm-delete'))) return false"
                   class="delete">
                    <i class="material-icons" data-toggle="tooltip" title="Excluir">&#xE872;</i>
                </a>

            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
