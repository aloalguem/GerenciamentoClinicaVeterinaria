<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Veterinário</title>

</head>
<body>
<div th:replace="~{fragments/config :: areaVeterinario }"></div>

<div class="vet-dashboard">
    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="text-center mb-10">
            <h1 class="text-2xl font-bold text-heading">VetPanel</h1>
            <p class="text-sm" id="vet-name">Dr(a). [Carregando...]</p>
        </div>
        <nav class="space-y-2">
            <a href="#" class="nav-link active" data-target="agenda"><svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg>Agenda</a>
            <a href="#" class="nav-link" data-target="pacientes"><svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.653-.124-1.282-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.653.124-1.282.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" /></svg>Pacientes</a>
            <a href="#" class="nav-link" data-target="configuracoes"><svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>Configurações</a>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Agenda Section -->
        <section id="agenda" class="content-section">
            <h2 class="text-3xl font-bold text-heading mb-6">Agenda</h2>
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                <!-- Calendar Column -->
                <div class="card">
                    <div class="calendar-header">
                        <button id="prev-month-btn" class="p-2 rounded-full hover:bg-gray-200">&lt;</button>
                        <h2 id="calendar-month-year"></h2>
                        <button id="next-month-btn" class="p-2 rounded-full hover:bg-gray-200">&gt;</button>
                    </div>
                    <div class="calendar-grid">
                        <div class="calendar-day-name">Dom</div><div class="calendar-day-name">Seg</div><div class="calendar-day-name">Ter</div><div class="calendar-day-name">Qua</div><div class="calendar-day-name">Qui</div><div class="calendar-day-name">Sex</div><div class="calendar-day-name">Sáb</div>
                    </div>
                    <div class="calendar-grid" id="calendar-grid"></div>
                </div>
                <!-- Appointments Column -->
                <div>
                    <h3 class="text-2xl font-bold text-heading mb-4" id="appointments-title">Agendamentos</h3>
                    <div id="appointments-list" class="space-y-4"></div>
                </div>
            </div>
        </section>

        <!-- Patients Section -->
        <section id="pacientes" class="content-section hidden">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-3xl font-bold text-heading">Pacientes</h2>
                <button id="add-patient-btn" class="primary-button">Adicionar Paciente</button>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4" id="patients-list"></div>
        </section>

        <!-- Settings Section -->
        <section id="configuracoes" class="content-section hidden">
            <h2 class="text-3xl font-bold text-heading mb-6">Configurações de Serviços</h2>
            <div class="card">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-xl font-semibold text-heading">Lista de Procedimentos</h3>
                    <button id="add-service-btn" class="primary-button">Adicionar Serviço</button>
                </div>
                <div class="space-y-3" id="services-list"></div>
            </div>
        </section>
    </main>
</div>

<!-- Modal Add/Edit Service -->
<div id="service-modal" class="modal-overlay hidden">
    <div class="modal-content">
        <h2 id="service-modal-title" class="text-2xl font-bold text-heading mb-4">Adicionar Serviço</h2>
        <form id="service-form" class="space-y-4">
            <input type="hidden" id="service-id">
            <div><label for="service-name" class="block text-sm font-medium">Nome do Procedimento</label><input type="text" id="service-name" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm"></div>
            <div><label for="service-price" class="block text-sm font-medium">Preço (R$)</label><input type="number" step="0.01" id="service-price" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm"></div>
            <div class="flex justify-end gap-4"><button type="button" id="cancel-service-modal" class="secondary-button">Cancelar</button><button type="submit" class="primary-button">Salvar</button></div>
        </form>
    </div>
</div>

<!-- Modal Adicionar Paciente -->
<div id="patient-modal" class="modal-overlay hidden">
    <div class="modal-content">
        <h2 id="patient-modal-title" class="text-2xl font-bold text-heading mb-4">Adicionar Paciente</h2>
        <form id="patient-form" class="space-y-4">
            <div>
                <label for="patient-name" class="block text-sm font-medium">Nome do Pet</label>
                <input type="text" id="patient-name" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm">
            </div>
            <div>
                <label for="patient-tutor" class="block text-sm font-medium">Nome do Tutor</label>
                <input type="text" id="patient-tutor" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm">
            </div>
            <div>
                <label for="patient-species" class="block text-sm font-medium">Espécie</label>
                <input type="text" id="patient-species" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm">
            </div>
            <div>
                <label for="patient-breed" class="block text-sm font-medium">Raça</label>
                <input type="text" id="patient-breed" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm">
            </div>
            <div>
                <label for="patient-age" class="block text-sm font-medium">Idade</label>
                <input type="number" id="patient-age" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm">
            </div>
            <div class="flex justify-end gap-4">
                <button type="button" id="cancel-patient-modal" class="secondary-button">Cancelar</button>
                <button type="submit" class="primary-button">Salvar</button>
            </div>
        </form>
    </div>
</div>



</body>
</html>
