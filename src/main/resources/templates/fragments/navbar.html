<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navbar AffectioVet</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>
</head>
<body>
<div th:fragment="navbar">
<nav class="navbar navbar-expand-lg fixed-top bg-body-tertiary">
    <div class="container-fluid justify-content-between">
        <a class="navbar-brand" href="/home">
            <img th:src="@{/assets/img/logo.png}" alt="logo" width="70" height="70">
            BelleVie
        </a>

        <ul class="navbar-nav nav-underline">
            <li class="nav-item">
                <a class="nav-link" href="/home">Home</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="/home#nossosServicosSection">Serviços</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:href="@{/produtos/visualizar}">Produtos</a>
            </li>
            <li class="nav-item" sec:authorize="hasAuthority('TUTOR')">
                <a class="nav-link" th:href="@{/produtos/carrinho}">Meu Carrinho</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="/home#sobreNosSection">Sobre Nós</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="/home#duvidasFrequentesSection">Dúvidas Frequentes</a>
            </li>
            <li class="nav-item" sec:authorize="hasAnyAuthority('VETERINARIO', 'ADMIN')">
                <a class="nav-link" th:href="@{/tutor}">Lista de Tutores</a>
            </li>
            <li class="nav-item" sec:authorize="hasAnyAuthority('VETERINARIO', 'ADMIN')">
                <a class="nav-link" th:href="@{/agendamento}">Lista de Agendamentos</a>
            </li>
            <li class="nav-item" sec:authorize="hasAnyAuthority('ADMIN')">
                <a class="nav-link" th:href="@{/veterinario}">Lista de Veterinários</a>
            </li>
            <li class="nav-item" sec:authorize="hasAuthority('TUTOR')">
                <a class="nav-link" th:href="@{/meupet/home}">Meu Pet</a>
            </li>
            <li class="nav-item" sec:authorize="isAuthenticated()">
                <form th:action="@{/logout}" method="post" class="d-inline">
                    <button type="submit" class="btn btn-link nav-link" style="border: none; background: none; color: #AE1313;">
                        Sair
                        <svg xmlns="http://www.w3.org/2000/svg" height="14" width="14" viewBox="0 0 640 640"><!--!Font Awesome Free v7.1.0 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2025 Fonticons, Inc.--><path fill="#ae1313" d="M569 337C578.4 327.6 578.4 312.4 569 303.1L425 159C418.1 152.1 407.8 150.1 398.8 153.8C389.8 157.5 384 166.3 384 176L384 256L272 256C245.5 256 224 277.5 224 304L224 336C224 362.5 245.5 384 272 384L384 384L384 464C384 473.7 389.8 482.5 398.8 486.2C407.8 489.9 418.1 487.9 425 481L569 337zM224 160C241.7 160 256 145.7 256 128C256 110.3 241.7 96 224 96L160 96C107 96 64 139 64 192L64 448C64 501 107 544 160 544L224 544C241.7 544 256 529.7 256 512C256 494.3 241.7 480 224 480L160 480C142.3 480 128 465.7 128 448L128 192C128 174.3 142.3 160 160 160L224 160z"/></svg>
                    </button>
                </form>
            </li>
        </ul>
    </div>
</nav>
</div>
<div class="max-w-7xl mx-auto p-4 md:p-8 pt-24"></div>
</body>
</html>
