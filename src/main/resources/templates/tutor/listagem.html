<!DOCTYPE html>
<html lang="pt-br" xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Lista de Tutores</title>
</head>

<!-- Include o fragmento de configuração -->
<body class="light:bg-light-background">
<!-- Configuração do tema -->
<div th:replace="~{fragments/config :: config_default}"></div>
<!-- Navbar -->
<div th:replace="~{fragments/navbar :: navbar}"></div>
<!-- Items fixos do tema -->
<div th:replace="~{fragments/botaosubir :: botaosubir}"></div>

<div th:replace="~{fragments/config :: listas}"></div>
<!--espaçamento entre a navbar e o conteúdo principal-->
<div class="max-w-7xl mx-auto p-4 md:p-8 pt-24"></div>

<div class="container mt-5">

    <h2 class="mb-4">Tutores Cadastrados</h2>
    <div sec:authorize="hasAuthority('ADMIN')">
        <a class="btn btn-primary mb-3" th:href="@{/tutor/novo}">Novo tutor</a>
    </div>
    <table class="table table-bordered table-striped">
        <thead class="table-dark">
        <tr>            <th>ID</th>
            <th>Nome</th>
            <th>Email</th>
            <th>CPF</th>
            <th>Telefone</th>
            <th>Ações</th>


        </tr>
        </thead>
        <tbody id="tabela-usuarios">
        <!-- Recurso do Themyleaf. Verifica se a lista de tutors está vazia -->
        <tr th:if="${#lists.isEmpty(tutores)}">
            <td colspan="2">Nenhum registro encontrado</td>
        </tr>

        <!-- Recurso do Themyleaf. Percorre a lista de tutors e preenche a tabela -->
        <tr th:each="tutor : ${tutores}">
            <td><span th:text="${tutor.id}"> ID </span></td>
            <td><span th:text="${tutor.nome}"> Nome </span></td>
            <td><span th:text="${tutor.email}"> Email </span></td>
            <td><span th:text="${tutor.cpf}"> CPF </span></td>
            <td><span th:text="${tutor.telefone}"> Telefone </span></td>

            
            <td sec:authorize="hasAuthority('ADMIN')">
                <!-- Recurso do Themyleaf. Carrega o id do tutor para ser alterado -->
                <a th:href="@{/tutor/alterar/{id}(id=${tutor.id})}" class="edit" data-toggle="modal">
                    <i class="material-icons" data-toggle="tooltip" title="Alterar">&#xE254;</i>
                </a>
                <a th:href="@{/tutor/excluir/{id}(id=${tutor.id})}"
                   th:data-confirm-delete="|Você gostaria de apagar ${tutor.nome}?|"
                   onclick="if (!confirm(this.getAttribute('data-confirm-delete'))) return false"
                   class="delete">
                    <i class="material-icons" data-toggle="tooltip" title="Excluir">&#xE872;</i>
                </a>

            </td>
        </tr>
        </tbody>
    </table>
</div>
<br>
</body>
</html>
