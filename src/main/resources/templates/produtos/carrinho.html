<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Carrinho</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
</head>
<body class="bg-body-tertiary">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container py-5 mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="mb-1">Meu Carrinho</h2>
            <p class="text-muted mb-0" th:text="${quantidadeItens} + ' item(ns) no carrinho'">0 item(s) no carrinho</p>
        </div>
        <a class="btn btn-outline-secondary" th:href="@{/produtos/visualizar}">Continuar comprando</a>
    </div>

    <div th:if="${mensagemSucesso}" class="alert alert-success" th:text="${mensagemSucesso}"></div>
    <div th:if="${mensagemErro}" class="alert alert-danger" th:text="${mensagemErro}"></div>

    <div th:if="${#lists.isEmpty(itens)}" class="text-center py-5 bg-white rounded shadow-sm">
        <p class="lead mb-4">Seu carrinho está vazio.</p>
        <a class="btn btn-success" th:href="@{/produtos/visualizar}">Explorar produtos</a>
    </div>

    <div th:if="${!#lists.isEmpty(itens)}" class="row g-4">
        <section class="col-lg-8">
            <div class="card shadow-sm">
                <div class="card-body p-0">
                    <div class="list-group list-group-flush">
                        <div class="list-group-item d-flex flex-column flex-md-row gap-3 align-items-start align-items-md-center" th:each="item : ${itens}">
                            <div class="d-flex gap-3">
                                <img th:src="${item.estoque.imagem}" th:alt="${item.estoque.nome}" class="rounded" style="width: 96px; height: 96px; object-fit: cover;">
                                <div>
                                    <h5 class="mb-1" th:text="${item.estoque.nome}">Nome do Produto</h5>
                                    <p class="text-muted mb-2" th:text="${item.estoque.descricao}">Descrição</p>
                                    <span class="fw-semibold" th:text="'R$ ' + ${#numbers.formatDecimal(item.estoque.precoVenda, 1, 2)}">R$ 0,00</span>
                                </div>
                            </div>
                            <div class="ms-md-auto w-100 w-md-auto d-flex flex-column gap-2">
                                <form th:action="@{/produtos/carrinho/atualizar/{id}(id=${item.id})}" method="post" class="d-flex flex-column flex-sm-row gap-2 align-items-sm-center">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                    <div class="input-group input-group-sm" style="max-width: 140px;">
                                        <span class="input-group-text">Qtd.</span>
                                        <input type="number" class="form-control" name="quantidade" min="1" th:value="${item.quantidade}" required>
                                    </div>
                                    <button type="submit" class="btn btn-sm btn-outline-primary">Atualizar</button>
                                </form>
                                <form th:action="@{/produtos/carrinho/remover/{id}(id=${item.id})}" method="post" class="d-inline">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                    <button type="submit" class="btn btn-sm btn-outline-danger w-100">Remover</button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <aside class="col-lg-4">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h5 class="card-title">Resumo do Pedido</h5>
                    <div class="d-flex justify-content-between mb-2">
                        <span>Subtotal</span>
                        <strong th:text="'R$ ' + ${#numbers.formatDecimal(total, 1, 2)}">R$ 0,00</strong>
                    </div>
                    <p class="text-muted small mb-4">O valor total será atualizado caso haja alteração no carrinho.</p>
                    <a class="btn btn-success w-100" th:href="@{/produtos/finalizarCompra}">Finalizar compra</a>
                </div>
            </div>
        </aside>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
</body>
</html>
