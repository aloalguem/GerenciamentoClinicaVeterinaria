<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página de Produtos</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" xintegrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/assets/css/home.css">
</head>
<body class="bg-body-tertiary">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<!-- Seção da Barra de Pesquisa no Topo -->
<section id="produtosSection">
<div class="container py-4">
    <div class="row">
        <div class="col-lg-6 offset-lg-3">
            <form role="search">
                <div class="input-group">
                    <input class="form-control" type="search" placeholder="Pesquisar..." aria-label="Pesquisar">
                    <button class="btn btn-outline-secondary" type="submit" aria-label="Buscar">
                        <i class="bi bi-search"></i>
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<div class="container">
    <div class="row">
        <div class="col-12">
            <div th:if="${mensagemSucesso}" class="alert alert-success" th:text="${mensagemSucesso}"></div>
            <div th:if="${mensagemErro}" class="alert alert-danger" th:text="${mensagemErro}"></div>
        </div>
    </div>
    <div class="row g-4">

        <!-- Barra Lateral de Filtros -->
        <aside class="col-md-4 col-lg-3">
            <div class="d-grid gap-3">
                <!-- Filtros Principais -->
                <form method="get" th:action="@{/produtos/visualizar}">
                    <div class="mb-3">
                        <label for="tipo" class="form-label visually-hidden">Tipo</label>
                        <select id="tipo" name="tipo" class="form-select">
                            <option value="">Tipo</option>
                            <option value="Antibióticos">Antibióticos</option>
                            <option value="Anti-inflamatórios e analgésicos">Anti-inflamatórios e analgésicos</option>
                            <option value="Dermatológicos e pele">Dermatológicos e pele</option>
                            <option value="Vitaminas e suplementos">Vitaminas e suplementos</option>
                            <option value="Antipulgas e vermífugos de venda livre">Antipulgas e vermífugos de venda livre</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="price-range" class="form-label visually-hidden">Preço</label>
                        <select id="price-range" name="preco" class="form-select">
                            <option value="">Faixa de Preço</option>
                            <option value="0-50">R$0 - R$50</option>
                            <option value="51-100">R$51 - R$100</option>
                            <option value="101-200">R$101 - R$200</option>
                        </select>
                    </div>


                    <button type="submit" class="btn btn-dark w-100 mt-2">Filtrar</button>
                </form>

                <div sec:authorize="hasAnyAuthority('VETERINARIO', 'ADMIN')">
                    <a th:href="@{/estoque}" class="btn btn-dark w-100 mt-2">Ver estoque</a>
                </div>

            </div>
        </aside>

        <!-- Grade de Produtos -->
        <main class="col-md-8 col-lg-9">
            <div class="row row-cols-1 row-cols-sm-2 row-cols-lg-3 g-4">
                <div class="col" th:each="estoque : ${estoques}">
                    <div class="card h-100 text-center">
                        <img th:src="${estoque.imagem}" class="card-img-top" th:alt="${estoque.nome}">
                        <div class="card-body">
                            <h5 class="card-title" th:text="${estoque.nome}">Nome do Produto</h5>
                            <p class="card-text" th:text="${estoque.descricao}">Descrição do Produto</p>
                            <hr>
                            <p class="card-text"><span th:text="'R$ ' + ${#numbers.formatDecimal(estoque.precoVenda, 1, 2)}">0.00</span></p>
                        </div>
                        <div class="card-footer bg-transparent border-top-0 p-3 pt-0">
                            <form th:action="@{/produtos/carrinho/adicionar/{id}(id=${estoque.id})}" method="post" class="d-flex flex-column gap-2">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <div class="input-group input-group-sm">
                                    <span class="input-group-text">Qtd.</span>
                                    <input type="number" class="form-control" name="quantidade" min="1" value="1" required>
                                </div>
                                <div sec:authorize="hasAnyAuthority('TUTOR')">
                                    <button type="submit" class="btn w-100 btn-success">Adicionar ao Carrinho</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </main>

    </div>
</div>
</section>

<!-- Bootstrap JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" xintegrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
