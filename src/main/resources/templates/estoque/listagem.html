<!DOCTYPE html>
<html lang="pt-br" xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Estoque</title>
    <!-- Bootstrap / CSS (se ainda não estiver incluso nos fragments) -->
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
</head>
<body class="light:bg-light-background">

<!-- Configuração do tema -->
<div th:replace="~{fragments/config :: config_default}"></div>

<!-- Navbar -->
<div th:replace="~{fragments/navbar :: navbar}"></div>

<!-- Botão para subir -->
<div th:replace="~{fragments/botaosubir :: botaosubir}"></div>
<div th:replace="~{fragments/config :: listas}"></div>
<!-- Espaçamento entre a navbar e o conteúdo principal -->
<div class="max-w-7xl mx-auto p-4 md:p-8 pt-24"></div>

<div class="container mt-5">
    <h2 class="mb-4">Estoque</h2>

    <div sec:authorize="hasAuthority('ADMIN')">
        <a class="btn btn-primary mb-3" th:href="@{/estoque/novo}">Novo Item</a>
    </div>

    <table class="table table-bordered table-striped">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>Tipo</th>
            <th>Descrição</th>
            <th>Quantidade</th>
            <th>Preço de Venda</th>
            <th>Foto</th>
            <th>Ações</th>
        </tr>
        </thead>
        <tbody>
        <!-- Caso a lista esteja vazia -->
        <tr th:if="${#lists.isEmpty(estoques)}">
            <td colspan="8" class="text-center">Nenhum registro encontrado</td>
        </tr>

        <!-- Percorre os estoques -->
        <tr th:each="estoque : ${estoques}">
            <td th:text="${estoque.id}">ID</td>
            <td th:text="${estoque.nome}">Nome</td>
            <td th:text="${estoque.tipo}">Tipo</td>
            <td th:text="${estoque.descricao}">Descrição</td>
            <td th:text="${estoque.qntd} + ' unid'">Quantidade</td>
            <td th:text="'R$ ' + ${#numbers.formatDecimal(estoque.precoVenda, 1, 2)}">Preço</td>
            <td>
                <img th:src="@{${estoque.imagem}}" alt="Imagem do produto" width="100">
            </td>
            <td>
                <!-- Alterar -->
                <a th:href="@{/estoque/alterar/{id}(id=${estoque.id})}" class="edit" data-toggle="tooltip" title="Alterar">
                    <i class="material-icons">&#xE254;</i>
                </a>
                <!-- Excluir -->
                <a th:href="@{/estoque/excluir/{id}(id=${estoque.id})}"
                   th:data-confirm-delete="|Você gostaria de apagar ${estoque.nome}?|"
                   onclick="if (!confirm(this.getAttribute('data-confirm-delete'))) return false"
                   class="delete" data-toggle="tooltip" title="Excluir">
                    <i class="material-icons">&#xE872;</i>
                </a>
            </td>
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>
