<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Lista de Pets</title>
</head>

<!-- Include o fragmento de configuração -->
<body class="light:bg-light-background">
<!-- Configuração do tema -->
<div th:replace="~{fragments/config :: config_default}"></div>
<!-- Navbar -->
<div th:replace="~{fragments/navbar :: navbar}"></div>
<!-- Items fixos do tema -->
<div th:replace="~{fragments/botaosubir :: botaosubir}"></div>
<!--espaçamento entre a navbar e o conteúdo principal-->
<div th:replace="~{fragments/config :: listas}"></div>
<div class="max-w-7xl mx-auto p-4 md:p-8 pt-24"></div>
<div class="container mt-5">




    <h2 class="mb-4">Pets Cadastrados</h2>
    <table class="table table-bordered table-striped">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>Raca</th>
            <th>Espécie</th>
            <th>Porte</th>
            <th>Peso</th>
            <th>Data de Nascimento</th>
            <th>Doenças</th>
            <th>Tutor</th>
            <th>Ações</th>


        </tr>
        </thead>
        <tbody id="tabela-usuarios">
        <!-- Recurso do Themyleaf. Verifica se a lista de pets está vazia -->
        <tr th:if="${#lists.isEmpty(pets)}">
            <td colspan="2">Nenhum registro encontrado</td>
        </tr>

        <!-- Recurso do Themyleaf. Percorre a lista de pets e preenche a tabela -->
        <tr th:each="pet : ${pets}">
            <td><span th:text="${pet.id}"> ID </span></td>
            <td><span th:text="${pet.nome}"> Nome </span></td>
            <td><span th:text="${pet.raca}"> Raça </span></td>
            <td><span th:text="${pet.especie}"> Espécie </span></td>
            <td><span th:text="${pet.porte}"> Porte </span></td>
            <td><span th:text="${pet.peso}"> Peso </span></td>
            <td><span th:text="${pet.dataNascimento}"> Data de Nascimento </span></td>
            <td><span th:text="${pet.doenca}"> Doenças </span></td>
            <td><span th:text="${pet.tutorId}"> Tutor </span></td>

            <td>
                <!-- Recurso do Themyleaf. Carrega o id do pet para ser alterado -->
                <a th:href="@{/pet/alterar/{id}(id=${pet.id})}" class="edit" data-toggle="modal">
                    <i class="material-icons" data-toggle="tooltip" title="Alterar">&#xE254;</i>
                </a>
                <a th:href="@{/pet/excluir/{id}(id=${pet.id})}"
                   th:data-confirm-delete="|Você gostaria de apagar ${pet.nome}?|"
                   onclick="if (!confirm(this.getAttribute('data-confirm-delete'))) return false"
                   class="delete">
                    <i class="material-icons" data-toggle="tooltip" title="Excluir">&#xE872;</i>
                </a>

            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
